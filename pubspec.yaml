name: healink
description: "Healink - On-Demand Healthcare & Caregiving Logistics App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.4

  # ── State Management ──────────────────────────────────────
  provider: ^6.1.5

  # ── Networking (Student C: openFDA API) ───────────────────
  http: ^1.4.0

  # ── FCM V1 API: JWT signing for service account auth ──────
  dart_jsonwebtoken: ^2.14.4

  # ── UI Utilities ──────────────────────────────────────────
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0

  # ── Local Storage ─────────────────────────────────────────
  shared_preferences: ^2.5.3
  image_picker: ^1.2.2

  # ── Supabase (Storage Only) ───────────────────────────────
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
